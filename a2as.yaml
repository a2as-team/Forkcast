        '## EXECUTION STEPS', '### 1. Sequential Processing', 'For each restaurant in search_results:', '- Extract `place_id`
          from the restaurant object', '- Call `maps_place_details(place_id)` to get comprehensive place information', '###
          2. Data Extraction & Processing', 'From each place details response, extract:', '- **Rating Analysis**: Overall
          rating, review count, rating breakdown', '- **Review Selection**: Top 5 most relevant reviews (prioritize recent
          + helpful)', '- **Content Analysis**: Identify mentioned food items, specialties, experiences', '- **Additional
          Links**: Menu URLs, delivery platform links', '### 3. Intelligent Review Processing', '- **Filter Quality**: Skip
          spam/irrelevant reviews', '- **Extract Insights**: Common themes, standout dishes, service quality', '- **Summarize**:
          Create concise review summary highlighting key points', '## OUTPUT FORMAT', 'Return ONLY a JSON array with this
          structure:', '```json', '[', '{', '"place_id": "string",', '"name": "string",', ']"website": "string",', '"all_reviews":
          [', '{', '"author_name": "John D.",', '"rating": 5,', '"text": "Amazing food and service...",', '"relative_time_description":
          "2 weeks ago",', '}', '],', '"reviews_summary": "string",  // generate this yourself based on the 5 reviews provided
          if you can''t get it from the API', '"special_items": [            // generate this yourself based on the 5 reviews
          provided if you can''t get it from the API', '{', '"item_name": "Signature Pad Thai",', '"mentions": 15,', '"context":
          "house specialty, highly recommended"', '}', '],', '}', ']', '```', '## PROCESSING RULES', '✅ **Sequential Processing**:
          Process one restaurant at a time using place_id', '✅ **Quality Focus**: Select most informative reviews, avoid spam',
        '✅ **Data Completeness**: Extract all available information, use `null` for missing data', '✅ **JSON ONLY**: Return
          only the JSON array, no explanations', '✅ **Review Relevance**: Prioritize reviews mentioning food quality, service,
          atmosphere', '## ERROR HANDLING', '- API failures: Continue with next restaurant, mark missing data', '- No reviews:
          Return empty arrays with appropriate flags', '- Incomplete data: Use `null`, don''t fabricate information', '- Rate
          limiting: Process sequentially to avoid API limits', '**Goal**: Provide comprehensive review intelligence for each
          restaurant to enable informed recommendations.', '**OUTPUT GUIDELINE: ** REMOVE ALL WHITESPACES OR NEW-LINE CHARACTERS,
          IT SHOULD BE A PURE JSON FILE']
      output_key: google_reviews_data
