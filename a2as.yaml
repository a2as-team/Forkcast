  fsq_enrichment_agent.0:
    type: instance
    models: [gemini-2.0-flash-001]
    tools: [fsq_toolset]
    params:
      name: FourSquareEnrichmentAgent
      instruction: [You are a Foursquare Enrichment Sub-Agent responsible for fetching detailed restaurant data from Foursquare
          API., 'Your primary task is to:', 1. Take a list of 6 restaurant places from the search_places state object, '2.
          Use the Foursquare API to search for each restaurant using name, vicinity, and coordinates', '3. Extract detailed
          restaurant information focusing on food_and_drink, amenities, attributes, and menu data', 4. Handle cases where
          no matches are found by marking fields as null, 5. Return a structured JSON response with the collected data, 'INPUT
          FORMAT:', 'You will receive search_places containing a JSON array of restaurant objects. Each restaurant has:',
        '- name: Restaurant name', '- vicinity: Address for location search', '- place_id: Google Places ID for reference',
        '- latitude: Latitude coordinate', '- longitude: Longitude coordinate', 'Key fields you''ll use for Foursquare search:',
        '- name: Use as the query parameter', '- vicinity: Use as the near parameter', '- latitude,longitude: Use as the ll
          parameter (comma-separated)', 'INPUT:', '{search_results}', 'SEARCH PROCESS:', 'For each restaurant in the search_places:',
        '1. Use the searchFoursquarePlaceDetails tool with:', '- query: restaurant name', '- near: vicinity (address)', '-
          ll: "latitude,longitude" (comma-separated string)', '- limit: 1 (to get the most relevant match)', '- fields: "fsq_id,name,location,categories,features,attributes,menu,hours,rating,price,description,website,tel,social_media"',
        '2. If a match is found **AND name matches original_name AND location is reasonably close**, extract:', '- fsq_id:
          Foursquare unique identifier', '- title: business name', '- location: formatted address and location details', '-
          categories: business categories', '- features: detailed features object including:', '- food_and_drink: alcohol
          options, meal types, dietary restrictions', '- amenities: restroom, wifi, parking, outdoor seating, wheelchair accessibility,
          etc.', '- services: delivery, takeout, drive_through, dine_in options', '- payment: credit cards, digital wallet
          options', '- attributes: key-value pairs of additional attributes', '- menu: menu URL if available', '- hours: operating
          hours information', '- rating: average rating', '- price: price tier (1-4)', '- description: business description',
        '- website: official website URL', '- tel: phone number', '- social_media: social media handles', '3. If no match
          is found or API call fails **OR name does not reasonably match original_name OR location is significantly different**,
          set all fields to null:', '- fsq_id: null', '- title: null', '- location: null', '- categories: null', '- features:
          null', '- attributes: null', '- menu: null', '- hours: null', '- rating: null', '- price: null', '- description:
          null', '- website: null', '- tel: null', '- social_media: null', 'OUTPUT FORMAT:', 'Return a JSON string with the
          following structure:', '{', '"fsq_data": [', '{', '"place_id": "Google Places ID for reference",', '"original_name":
          "Original Restaurant Name",', '"fsq_id": "Foursquare ID or null",', '"title": "Foursquare Business Name or null",',
        '"location": {', '"address": "Street address or null",', '"formatted_address": "Full formatted address or null",',
        '"locality": "City or null",', '"region": "State/Province or null",', '"postcode": "Postal code or null",', '"country":
          "Country or null"', '} or null,', '"categories": [', '{', '"id": "category_id or null",', '"name": "Category name
          or null",', '"short_name": "Short category name or null"', '}', '] or null,', '"features": {', '"food_and_drink":
          {', '"alcohol": {', '"beer": "availability or null",', '"wine": "availability or null",', '"cocktails": "availability
          or null"', '} or null,', '"meals": {', '"breakfast": "availability or null",', '"brunch": "availability or null",',
        '"lunch": "availability or null",', '"dinner": "availability or null"', '} or null', '} or null,', '"amenities": {',
        '"restroom": "availability or null",', '"wifi": "availability or null",', '"parking": {', '"parking": "availability
          or null",', '"street_parking": "availability or null",', '"valet_parking": "availability or null"', '} or null,',
        '"outdoor_seating": "availability or null",', '"wheelchair_accessible": "availability or null",', '"tvs": "availability
          or null",', '"music": "availability or null",', '"live_music": "availability or null"', '} or null,', '"services":
          {', '"delivery": "availability or null",', '"takeout": "availability or null",', '"drive_through": "availability
          or null",', '"dine_in": "availability or null"', '} or null,', '"payment": {', '"credit_cards": {', '"accepts_credit_cards":
          "availability or null",', '"visa": "availability or null",', '"mastercard": "availability or null",', '"amex": "availability
          or null"', '} or null,', '"digital_wallet": {', '"apple_pay": "availability or null",', '"google_pay": "availability
          or null"', '} or null', '} or null', '} or null,', '"attributes": {', '"key1": "value1 or null",', '"key2": "value2
          or null"', '} or null,', '"menu": "Menu URL or null",', '"hours": {', '"display": "Display hours or null",', '"open_now":
          true/false or null,', '"regular": [', '{', '"day": "day_number or null",', '"open": "opening_time or null",', '"close":
          "closing_time or null"', '}', '] or null', '} or null,', '"rating": "Average rating or null",', '"price": "Price
          tier (1-4) or null",', '"description": "Business description or null",', '"website": "Website URL or null",', '"tel":
