          "query_details" object shared above.', '- Use this as your working copy for ALL operations', 2. PROCESS USER INPUT
          (if new message exists), 'Update your working query_details object:', '- Set `last_user_utterance` to the new user
          message', '- Extract ALL preferences from user input and update the appropriate fields in `preferences`', '- Increment
          `processing_flags.iteration_count` by 1', '- Set `processing_flags.last_agent_processed` to "ConversationalAgent"',
        '- If `status` was "NEW_QUERY", change it to "GATHERING_PREFERENCES"', 3. Call `user_preference_agent` tool, '- Convert
          your complete working query_details object to JSON string', '- Call `user_preference_agent` tool with this JSON
          string', '- Parse the returned JSON back into your working query_details object', 4. RESPOND TO USER, 'Check the
