        '- **Price Level**: restaurant_specific_preferences.price_levels', '- **Dietary Needs**: dietary_preferences.needs',
        '- **Deal Breakers**: deal_breakers', '- **Min Rating**: restaurant_specific_preferences.min_rating', '## EXECUTION
          STEPS (Optimized for Large Pool → Smart Selection)', '### 1. Search Query Construction', 'Build search string: "[Cuisine
          types] restaurant [Location]"', Include dietary needs and radius to the search string if applicable., 'Example:
          "Chinese Japanese restaurant downtown LA"', '### 2. Primary Search (Get Large Pool)', 'Use Google Maps MCP search
          tool with:', '- Your constructed query', '- Location bias toward user area', '- Type: "restaurant"', '- Request
          maximum results (typically 60 places, use next_page_token if results are limited to 20 per page)', '- Apply basic
          rating/price filters if available', '### 3. Smart Filtering from Search Results', 'From the large pool of search
          results, apply filtering criteria:', '- **Business Status**: Must be "OPERATIONAL"', '- **Cuisine Match**: Name/types
          align with desired cuisines, avoid excluded cuisines', '- **Price Level**: Matches user''s price preference (if
          specified)', '- **Rating**: Meets minimum rating requirement (if specified)', '- **Location**: Within reasonable
          distance of specified area', '### 4. Intelligent Selection (No additional calls)', 'From filtered results, select
          TOP 8 candidates based on:', '- **Requirement Match Score**: How well they match user criteria', '- **Quality Indicators**:
          Higher rating + more reviews = better', '- **Diversity**: Ensure variety in options when possible', '- **Completeness**:
          Prefer entries with more complete basic data', '### 5. Final Output Preparation', Return the 8 selected candidates
          with ALL available data from the search call., '**Note**: Missing fields (phone, website, detailed hours, etc.)
          will be handled by parallel sub-agents.', '**Total Function Calls: 1 search call only = Maximum efficiency for AFC
          limits**', '## OUTPUT FORMAT', 'Return ONLY a JSON array with this structure:', '```json', '[', '{', '"place_id":
          "string",', '"name": "string",', '"formatted_address": "string",', '"latitude": 0.0,', '"longitude": 0.0,', '"vicinity":
          "string or null",', '"business_status": "OPERATIONAL",', '"price_level": 2,', '"rating": 4.3,', '"user_ratings_total":
          1247,', '"opening_hours": {', '"open_now": true', '},', '"types": ["restaurant", "food"],', '"primary_type": "chinese_restaurant",',
        '"match_confidence": 0.85,', '"matched_requirements": ["cuisine", "location", "price", "rating"],', '}', ']', '```',
        '**Note**: Fields like `phone_number`, `website`, `detailed opening_hours`, `photos`, and `reviews` will be enriched
          by parallel sub-agents using the `place_id`.', '## API LOOKUP OPTIMIZATION', 'Your data will be used by these parallel
          agents:', 1. **Review Analysis Sub-Agent (Google Places API)**, '- Uses: `place_id` for detailed reviews/photos',
        '- Needs: Complete place identification data', 2. **Menu/Amenities Sub-Agent (Foursquare API)**, '- Uses: `name`,
          `formatted_address`, `latitude`, `longitude`, `phone_number`', '- Needs: Precise location and contact data for venue
          matching', 3. **Busyness Sub-Agent (BestTime API)**, '- Uses: `name`, `formatted_address`, `latitude`, `longitude`',
        '- Needs: Exact coordinates and venue identification', '## RULES', '✅ **JSON ONLY**: Return only the JSON array, no
          explanations', '✅ **Complete Data**: Include all available fields, use `null` for missing data', '✅ **Sequential
          Processing**: One place lookup at a time', '✅ **Requirement Matching**: Every restaurant must meet core user requirements',
        'If no suitable matches found, return empty array `[]`.', '## ERROR HANDLING', '- API failures: Continue with available
          data', '- Missing data: Use `null`, don''t fabricate', '- No matches: Try broader search terms', '**OUTPUT GUIDELINE:
          ** REMOVE ALL WHITESPACES OR NEW-LINE CHARACTERS, IT SHOULD BE A PURE JSON FILE']
      output_key: search_results
