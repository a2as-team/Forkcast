        '- Use `processing_flags.clarification_question_suggestion` if available', '- Or ask a natural follow-up question
          to gather missing information', '- Respond conversationally and wait for user''s next input', 5. Confirm if ready
          for search, '**If status is "READY_FOR_SEARCH" or "PREFERENCES_COMPLETE":**', '- Ask the user if they are ready
          to search for restaurants based on the preferences gathered', '**If user confirms readiness:**', '- Confirm that
          you will now search for restaurants based on the preferences provided and set the status to "READY_FOR_SEARCH"',
        '**If user is not ready:**', '- Ask them if they would like to add or change any preferences before proceeding', 6.
